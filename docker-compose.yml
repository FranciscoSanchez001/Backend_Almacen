# ============================================================================
# Backend_Almacen · docker-compose de toda la aplicación
#   db          PostgreSQL 15                    -> localhost:5432
#   migraciones Aplica las migraciones de EF Core y termina
#   api         ASP.NET Core 10 Web API          -> http://localhost:5000
#   spa         React + Vite servido por Nginx   -> http://localhost:8080
#   postgrest   API REST automática sobre la base -> http://localhost:3000
#   whatsapp    Servicio de Baileys (envío de WhatsApp); solo lo usa la API, no se publica
#
# Orden de arranque: db (healthy) -> migraciones (terminada) -> api (healthy) -> spa
#
# Redes:
#   backend   db, migraciones, api, postgrest y whatsapp. La SPA no tiene acceso a la base de datos.
#   frontend  api y spa.
#
# Uso (desde la raíz del repositorio):  docker compose up -d --build
# ============================================================================

# Nombre fijo del proyecto: así los volúmenes no dependen del nombre de la carpeta.
name: backend_almacen

services:
  # -------------------------------------------------------------
  # Base de datos relacional (PostgreSQL 15)
  # -------------------------------------------------------------
  db:
    # Variante Debian (no Alpine): su collation glibc ordena bien los acentos (Á junto a A).
    image: postgres:15
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: midatabase
      POSTGRES_USER: miusuario
      POSTGRES_PASSWORD: mipassword
    ports:
      - "5432:5432"
    volumes:
      - postgres15_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miusuario -d midatabase"]
      interval: 5s
      timeout: 5s
      retries: 10

  # -------------------------------------------------------------
  # Migraciones de EF Core (se ejecuta una vez y termina)
  # -------------------------------------------------------------
  migraciones:
    build:
      context: src/backend
      dockerfile_inline: |
        FROM mcr.microsoft.com/dotnet/sdk:10.0 AS build
        WORKDIR /src
        RUN dotnet tool install --global dotnet-ef --version 10.0.12
        ENV PATH="$${PATH}:/root/.dotnet/tools"
        COPY . .
        RUN dotnet restore Presentation.API/Presentation.API.csproj
        RUN dotnet ef migrations bundle --project Infrastructure --startup-project Presentation.API -o /app/efbundle

        FROM mcr.microsoft.com/dotnet/aspnet:10.0
        WORKDIR /app
        COPY --from=build /app/efbundle .
        COPY --from=build /src/Presentation.API/appsettings*.json ./
        ENTRYPOINT ["./efbundle"]
    container_name: almacen_migraciones
    command: ["--connection", "Host=db;Port=5432;Database=midatabase;Username=miusuario;Password=mipassword"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy

  # -------------------------------------------------------------
  # Backend ASP.NET Core 10 Web API
  # -------------------------------------------------------------
  api:
    build:
      context: src/backend
      dockerfile: Presentation.API/Dockerfile
    container_name: almacen_api
    restart: unless-stopped
    ports:
      # host:contenedor -> la API queda en http://localhost:5000
      - "5000:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Almacen: Host=db;Port=5432;Database=midatabase;Username=miusuario;Password=mipassword
      # Datos de demostración (90 días de pedidos, clientes y personal) para el dashboard KPI.
      # Solo siembra si la base no tiene pedidos: en los arranques siguientes no hace nada.
      SiembraDemo__Habilitada: "true"
      # Servicio de WhatsApp (Baileys). La clave debe coincidir con API_KEY del servicio.
      Whatsapp__ServicioUrl: http://whatsapp:3001
      Whatsapp__ApiKey: ${WHATSAPP_API_KEY:-clave-local-whatsapp}
    volumes:
      # Capturas de pago subidas por los clientes (cuando no hay Cloudinary configurado).
      - capturas_pago:/app/wwwroot/capturas
    networks:
      - backend
      - frontend
    # GET /health responde 200 solo si la API puede conectarse a PostgreSQL.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      migraciones:
        condition: service_completed_successfully

  # -------------------------------------------------------------
  # Frontend React + Vite + Nginx (SPA)
  # -------------------------------------------------------------
  spa:
    build:
      context: src/frontend
      dockerfile: Dockerfile
      args:
        # Dirección de la API tal como la ve el NAVEGADOR (tu máquina).
        VITE_API_URL: http://localhost:5000
        VITE_GOOGLE_CLIENT_ID: ""
    container_name: almacen_spa
    restart: unless-stopped
    ports:
      # host:contenedor -> la app queda en http://localhost:8080
      - "8080:80"
    networks:
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      api:
        condition: service_healthy

  # -------------------------------------------------------------
  # WhatsApp con Baileys: el gerente vincula el teléfono desde
  # Administración > WhatsApp (código QR) y la API envía por aquí los mensajes de los pedidos.
  # No publica puertos: solo la API lo alcanza por la red interna.
  # -------------------------------------------------------------
  whatsapp:
    build:
      context: src/whatsapp
    container_name: almacen_whatsapp
    restart: unless-stopped
    environment:
      API_KEY: ${WHATSAPP_API_KEY:-clave-local-whatsapp}
    volumes:
      # Sesión del teléfono vinculado: sobrevive a reinicios (no hay que volver a escanear el QR).
      - whatsapp_sesion:/app/sesion
    networks:
      - backend

  # -------------------------------------------------------------
  # PostgREST (API REST automática sobre la base de datos)
  # -------------------------------------------------------------
  postgrest:
    image: postgrest/postgrest
    container_name: postgrest_api
    ports:
      - "3000:3000"
    environment:
      # Conexión a la base de datos: postgres://usuario:password@servicio:puerto/nombre_bd
      PGRST_DB_URI: postgres://miusuario:mipassword@db:5432/midatabase
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: miusuario
    networks:
      - backend
    depends_on:
      migraciones:
        condition: service_completed_successfully

networks:
  backend:
  frontend:

volumes:
  postgres15_data:
  capturas_pago:
  whatsapp_sesion:
