# ============================================================================
# Backend_Almacen · Pipeline de integración continua (GitHub Actions)
#   backend-ci   Restaura, compila y ejecuta las pruebas .NET 10
#                (unitarias xUnit + Moq, arquitectura e integración con Testcontainers)
#   frontend-ci  Instala, prueba (Vitest) y compila la SPA React + Vite
#   publicar     Publica los artefactos (API + SPA) SOLO si los dos jobs anteriores pasan
# ============================================================================

name: CI Pipeline - Backend Almacen

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# Si llega un push nuevo a la misma rama, se cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUCION: src/backend/Backend_Almacen.slnx

jobs:
  # -------------------------------------------------------------
  # Backend .NET 10: restauración, compilación y pruebas
  # -------------------------------------------------------------
  backend-ci:
    name: Compilación y Pruebas Backend (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependencias
        run: dotnet restore ${{ env.SOLUCION }}

      - name: Compilar Solución
        run: dotnet build ${{ env.SOLUCION }} --configuration Release --no-restore

      - name: Ejecutar Pruebas Unitarias (xUnit & Moq)
        run: >
          dotnet test tests/UnitTests/UnitTests.csproj
          --configuration Release --no-build --verbosity normal
          --logger "trx;LogFileName=UnitTests.trx" --results-directory TestResults

      - name: Ejecutar Pruebas de Arquitectura (Onion)
        run: >
          dotnet test tests/ArchitectureTests/ArchitectureTests.csproj
          --configuration Release --no-build --verbosity normal
          --logger "trx;LogFileName=ArchitectureTests.trx" --results-directory TestResults

      # Testcontainers levanta un PostgreSQL real; ubuntu-latest ya trae Docker.
      - name: Ejecutar Pruebas de Integración (Testcontainers + PostgreSQL)
        run: >
          dotnet test tests/IntegrationTests/IntegrationTests.csproj
          --configuration Release --no-build --verbosity normal
          --logger "trx;LogFileName=IntegrationTests.trx" --results-directory TestResults

      # Los reportes se suben aunque falle alguna prueba, para poder revisarlos.
      - name: Subir reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas-backend
          path: TestResults/*.trx
          retention-days: 14

  # -------------------------------------------------------------
  # Frontend React + Vite: instalación, pruebas y compilación
  # -------------------------------------------------------------
  frontend-ci:
    name: Pruebas y Compilación Frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar Pruebas (Vitest)
        run: npm test

      - name: Compilar SPA
        run: npm run build

  # -------------------------------------------------------------
  # Publicación de artefactos: solo si TODAS las pruebas pasaron
  # -------------------------------------------------------------
  publicar:
    name: Publicar Artefactos (API + SPA)
    runs-on: ubuntu-latest
    needs: [ backend-ci, frontend-ci ]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Publicar API
        run: >
          dotnet publish src/backend/Presentation.API/Presentation.API.csproj
          --configuration Release --output publicacion/api /p:UseAppHost=false

      - name: Compilar SPA para producción
        working-directory: ./src/frontend
        run: |
          npm ci
          npm run build

      - name: Subir artefacto de la API
        uses: actions/upload-artifact@v4
        with:
          name: api-publicada
          path: publicacion/api
          retention-days: 14

      - name: Subir artefacto de la SPA
        uses: actions/upload-artifact@v4
        with:
          name: spa-dist
          path: src/frontend/dist
          retention-days: 14
